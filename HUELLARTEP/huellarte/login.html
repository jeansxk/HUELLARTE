<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - Huellarte</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <script src="https://kit.fontawesome.com/923b6588de.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #a6e1fa, #f7f9fc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .login-card img {
      object-fit: cover;
      height: 100%;
    }
    .btn-primary {
      background-color: #0d6efd;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card login-card">
        <div class="row g-0">
          <!-- Imagen -->
          <div class="col-md-6 d-none d-md-block">
            <img src="media/perro.jpg" alt="Mascotas" class="w-100 h-100">
          </div>
          <!-- Formulario -->
          <div class="col-md-6 p-4 bg-white">
            <div class="text-center mb-4">
              <img src="media/logo.png" alt="Huellarte Logo" width="150">
              <h3 class="fw-bold mt-3">Bienvenido</h3>
              <p class="text-muted">Inicia sesión para continuar</p>
            </div>
           <form action="../CONTROLADOR/PHP/login.php" method="POST">
     <div class="mb-3">
    <label for="email" class="form-label fw-semibold"><i class="fas fa-envelope me-2"></i>Correo</label>
    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
  </div>
  <div class="mb-3">
    <label for="password" class="form-label fw-semibold"><i class="fas fa-lock me-2"></i>Contraseña</label>
    <input type="password" id="password" name="password" class="form-control" placeholder="********" required>
  </div>
   <div class="d-flex justify-content-between mb-3">
                <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
              </div>
  <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar</button>
  <a href="../huellarte/index.html" class="btn btn-outline-secondary w-100 mt-2"><i class="fas fa-home me-2"></i>Volver a Inicio</a>
</form>

            <div class="text-center mt-4">
              <p>¿No tienes cuenta? <a href="registra.html" class="fw-bold text-primary">Regístrate</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<script src="js/bootstrap.bundle.js"></script>

</html>
