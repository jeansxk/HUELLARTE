<html lang="es">
<head>
  <meta charset="utf-8">

  <!-- Google Fonts -->

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  

  <!-- Contenedor Principal -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="col-lg-9 col-md-11">
      <div class="card login-card shadow-lg overflow-hidden">
        <div class="row g-0">
          <!-- Imagen Lateral (solo en escritorio) -->
          <div class="col-md-6 d-none d-md-flex bg-image">
            <img src="media/perro.jpg" alt="Mascotas esperando un hogar" class="w-100 h-100 object-fit-cover">
          </div>
          <!-- Formulario -->
          <div class="col-md-6 p-5 bg-white d-flex flex-column justify-content-center">
            <div class="text-center mb-4">
              <img src="media/logo.png" alt="Huellarte Logo" width="130" class="mb-3">
              <h3 class="fw-bold">¡Hola de nuevo!</h3>
              <p class="text-muted">Inicia sesión para continuar</p>
            </div>

            <!-- Formulario -->
            <form action="../CONTROLADOR/login.php" method="POST">
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">
                  <i class="fas fa-envelope me-2 text-primary"></i> Correo Electrónico
                </label>
                <input type="email" id="email" name="email" class="form-control form-control-lg py-2" placeholder="ejemplo@huellarte.com" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                  <i class="fas fa-lock me-2 text-primary"></i> Contraseña
                </label>
                <input type="password" id="password" name="password" class="form-control form-control-lg py-2" placeholder="••••••••" required>
              </div>
              <div class="d-flex justify-content-between mb-4">
                <a href="#" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
              </div>
              <button type="submit" name="login" class="btn btn-primary btn-lg w-100 fw-bold py-3 rounded-pill mb-3">
                Ingresar
              </button>
            </form>

            <div class="text-center mt-4">
              <p class="mb-0">¿No tienes cuenta? <a href="registra.html" class="fw-bold text-primary">Regístrate aquí</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Mini (opcional, si quieres mantenerlo en login) -->
  <footer class="text-white py-3 small">
    <div class="container text-center">
      <p class="mb-0">© 2025 Huellarte — Conectando vidas, una pata a la vez. ❤️</p>
